[package]
name = "lit-annotation-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Scanner, parser, scope resolver, and emitter for the Lit annotation DSL"
repository = "https://github.com/tlkahn/lit-annotation-core"
readme = "README.md"
keywords = ["annotation", "markdown", "parser", "lit"]
categories = ["parser-implementations", "text-processing"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
toml = "0.8"
# Exact pin: segmentation behavior is load-bearing for annotation scope
# resolution (lit#945) - bump deliberately and re-run the ctx parity sweeps.
sentencex = "=0.1.30"

[[bin]]
name = "lit-annotation"
path = "src/bin/lit_annotation.rs"

[dev-dependencies]
tempfile = "3"
